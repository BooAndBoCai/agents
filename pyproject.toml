[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agents"
version = "0.1.0"
description = "Quick codebase analysis agent — ask questions about your code without polluting your main context"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.scripts]
codebase-analyze = "agents.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
